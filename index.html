<body style="background-color: #ddd">

    <nav class="navbar navbar-dark bg-dark d-flex justify-content-between">
        <img src="favicon.png">
        <a class="navbar-brand" href="index.html">GALYORKA!</a>
        <div class="d-flex align-items-center">
            <a href="#" class="text-light mr-3">Настройки</a>
            <img src="avatar.png" class="rounded-circle" alt="avatar">
        </div>
    </nav>

    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">

                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4">Регистрация</h4>

                        <form id="register-form">
                            <div class="form-group">
                                <label for="nickname">Никнейм</label>
                                <input type="text" class="form-control" id="nickname" name="nickname" placeholder="Придумайте никнейм" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Почта</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Пароль</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Не менее 8 символов" required>
                            </div>

                            <button type="submit" class="btn btn-dark btn-block">Зарегистрироваться</button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
