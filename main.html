    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<body style="background-color: #ddd">

    <nav class="navbar navbar-dark bg-dark d-flex justify-content-between">
        <img src="favicon.png">
        <a class="navbar-brand" href="index.html">GALYORKA!</a>
        <div class="d-flex align-items-center">
            <a href="#" class="text-light mr-3">Настройки</a>
            <img src="avatar.png" class="rounded-circle" alt="avatar">
        </div>
    </nav>

    <div class="container-fluid">

        <div class="row py-3">
            <div class="col-12" id="messages-feed">

                <div class="border-bottom py-2 d-flex justify-content-between">
                    <span>всем привет</span>
                    <small class="text-muted">от: макб</small>
                </div>

                <div class="border-bottom py-2 d-flex justify-content-between">
                    <span>сиди на парах</span>
                    <small class="text-muted">от: максб</small>
                </div>

                <div class="border-bottom py-2 d-flex justify-content-between">
                    <span>поменяй никнейм</span>
                    <small class="text-muted">от: макб</small>
                </div>

                <div class="border-bottom py-2 d-flex justify-content-between">
                    <span>себя поменяй &gt;:(</span>
                    <small class="text-muted">от: максб</small>
                </div>

                <div class="border-bottom py-2 d-flex justify-content-between">
                    <span>я домой хочу...</span>
                    <small class="text-muted">от: эмомальчик07</small>
                </div>

                <div class="border-bottom py-2 d-flex justify-content-between">
                    <span>:(</span>
                    <small class="text-muted">от: эмомальчик07</small>
                </div>

            </div>
        </div>

        <div class="row fixed-bottom bg-white py-2 border-top">
            <div class="col-12">
                <small class="d-block mb-1"><strong>вы:</strong> <span id="current-user">гость</span></small>
                <form class="d-flex" id="chat-form">
                    <input type="text" class="form-control rounded-pill mr-2" name="message" id="message" placeholder="Пишите...">
                    <button type="submit" class="btn btn-dark rounded-circle">&uarr;</button>
                </form>
            </div>
        </div>

    </div>

</body>
<script src="site.js"></script>
</html>
